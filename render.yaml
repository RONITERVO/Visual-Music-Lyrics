services:
  - type: web
    name: audio-visualizer-ai-studio-edition-api
    env: node
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://ronitervo.github.io
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_KEY_MAX_CONCURRENCY
        value: 1
      - key: GEMINI_KEY_REQUESTS_PER_MINUTE
        value: 12
      - key: GEMINI_KEY_REQUESTS_PER_DAY
        value: 0
      - key: GEMINI_USER_REQUESTS_PER_MINUTE
        value: 6
      - key: GEMINI_USER_REQUESTS_PER_DAY
        value: 120
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_MAX_CONCURRENT_JOBS
        value: 1
      - key: YOUTUBE_JOB_QUEUE_LIMIT
        value: 8
      - key: YOUTUBE_COOKIES_BASE64
        sync: false
      - key: YOUTUBE_COOKIES_FILE
        sync: false
