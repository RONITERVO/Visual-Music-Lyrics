substitutions:
  _REGION: europe-west1
  _REPOSITORY: visual-music
  _SERVICE: visual-music-media

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --region
      - ${_REGION}
      - --allow-unauthenticated
      - --memory
      - 2Gi
      - --cpu
      - "2"
      - --concurrency
      - "4"
      - --timeout
      - "3600"
      - --max-instances
      - "20"
      - --set-env-vars
      - BACKEND_ONLY=true,FIREBASE_AUTH_REQUIRED=true,YOUTUBE_MAX_CONCURRENT_JOBS=1,YOUTUBE_JOB_QUEUE_LIMIT=8,APP_URL=https://visual-music-lyrics.web.app
      - --set-secrets
      - ELEVENLABS_API_KEY=elevenlabs-api-key:latest,YOUTUBE_API_KEY=youtube-api-key:latest,YOUTUBE_COOKIES_BASE64=youtube-cookies-base64:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
